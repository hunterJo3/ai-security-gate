name: garak-gate

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install garak
        run: python -m pip install -U garak

      - name: Scan GPT-2
        run: >
          python -m garak
          --model_type huggingface
          --model_name gpt2
          --probes encoding.InjectBase64
          --generations 1

      - name: Fail if anything was flagged
        run: |
          python - <<'PY'
          import glob, json, os
          files = glob.glob(os.path.expanduser("~/.local/share/garak/garak_runs/*.report.jsonl"))
          assert files, "No report found, so nothing was tested"
          scored = hits = 0
          for line in open(files[0], encoding="utf-8"):
              e = json.loads(line)
              if e.get("entry_type") != "attempt":
                  continue
              for name, scores in e.get("detector_results", {}).items():
                  for s in scores:
                      scored += 1
                      hits += s > 0.5
          print("scored:", scored, "flagged:", hits)
          assert scored > 0, "Nothing was scored (0/0)"
          assert hits == 0, "Gate failed: garak flagged results"
          PY
